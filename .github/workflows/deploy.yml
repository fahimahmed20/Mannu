name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── Push code + build on server (63GB RAM, no SWC binary issue) ────
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -e

            # ── Backup admin config files (NOT species-data — git is authoritative) ──
            mkdir -p /tmp/manu-backup
            [ -f ~/manu-explorers/data/categories.json ]  && cp ~/manu-explorers/data/categories.json  /tmp/manu-backup/
            [ -f ~/manu-explorers/data/admin-users.json ] && cp ~/manu-explorers/data/admin-users.json /tmp/manu-backup/
            [ -f ~/manu-explorers/data/app-config.json ]  && cp ~/manu-explorers/data/app-config.json  /tmp/manu-backup/

            # ── Pull latest code (or clone if first time) ──
            if [ -d ~/manu-explorers/.git ]; then
              cd ~/manu-explorers
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/fahimahmed20/Mannu.git ~/manu-explorers
              cd ~/manu-explorers
            fi

            # ── Install all dependencies (need dev deps for build) ──
            npm install --no-audit --no-fund

            # ── Remove crashing SWC native binaries; Next.js falls back to pure JS ──
            rm -f node_modules/@next/swc-linux-x64-gnu/next-swc.linux-x64-gnu.node
            rm -f node_modules/@next/swc-linux-x64-musl/next-swc.linux-x64-musl.node

            # ── Build on server (has plenty of RAM) ──
            npm run build

            # ── Restore admin config files (species-data comes from git) ──
            [ -f /tmp/manu-backup/categories.json ]  && cp /tmp/manu-backup/categories.json  data/
            [ -f /tmp/manu-backup/admin-users.json ] && cp /tmp/manu-backup/admin-users.json data/
            [ -f /tmp/manu-backup/app-config.json ]  && cp /tmp/manu-backup/app-config.json  data/
            rm -rf /tmp/manu-backup

            # ── Init runtime data files if missing ──
            [ -f data/media.json ]        || echo "[]" > data/media.json
            [ -f data/activity-log.json ] || echo "[]" > data/activity-log.json
            [ -f data/app-users.json ]    || echo "[]" > data/app-users.json
            [ -f data/otp-store.json ]    || echo "{}" > data/otp-store.json

            # ── Restart via Passenger signal ──
            mkdir -p public/uploads tmp
            touch tmp/restart.txt

            echo "✅ Deployment complete"
