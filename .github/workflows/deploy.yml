name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Build on CI runner (has plenty of RAM, no OOM risk) ──
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # ── Step 1: backup live data, copy latest source, clear old build ──
      - name: Prepare server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            APP=~/public_html/apptest
            SRC=~/manu-explorers

            # Pull latest code into staging dir
            if [ -d $SRC/.git ]; then
              cd $SRC && git fetch origin main && git reset --hard origin/main
            else
              git clone https://github.com/fahimahmed20/Mannu.git $SRC
            fi

            # Backup live data + credentials from apptest
            mkdir -p /tmp/app-backup
            cp -r $APP/data       /tmp/app-backup/ 2>/dev/null || true
            cp    $APP/.env.local /tmp/app-backup/ 2>/dev/null || true
            cp -r $APP/public/uploads /tmp/app-backup/ 2>/dev/null || true

            # Copy updated source files into apptest
            cp -rf $SRC/app          $APP/
            cp -rf $SRC/lib          $APP/
            cp -rf $SRC/components   $APP/
            cp     $SRC/server.js    $APP/
            cp     $SRC/package.json $APP/
            cp     $SRC/package-lock.json $APP/
            cp     $SRC/next.config.ts    $APP/
            cp     $SRC/tsconfig.json     $APP/
            cp     $SRC/postcss.config.mjs $APP/
            cp     $SRC/eslint.config.mjs  $APP/ 2>/dev/null || true
            cp     $SRC/public/*.js   $APP/public/ 2>/dev/null || true
            cp     $SRC/public/*.json $APP/public/ 2>/dev/null || true
            cp     $SRC/public/*.png  $APP/public/ 2>/dev/null || true
            cp     $SRC/public/*.ico  $APP/public/ 2>/dev/null || true

            # Restore live data and credentials
            cp -r /tmp/app-backup/data/*  $APP/data/   2>/dev/null || true
            cp    /tmp/app-backup/.env.local $APP/      2>/dev/null || true
            mkdir -p $APP/public/uploads
            cp /tmp/app-backup/uploads/* $APP/public/uploads/ 2>/dev/null || true
            rm -rf /tmp/app-backup

            # NOTE: do NOT delete .next here — the server is still running and
            # would return 500 for any static-chunk request with no .next dir.
            # The SCP upload (next step) overwrites files in-place; old
            # content-hashed chunks keep their filenames so they stay valid
            # for browsers that still have the previous SW cache.

      # ── Step 2: upload the pre-built .next + generated SW files from CI ──
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: ".next,public/sw.js,public/workbox-*.js,public/swe-worker-*.js"
          target: "~/public_html/apptest/"

      # ── Step 3: install prod deps, init data files ──
      - name: Finalize
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            cd ~/public_html/apptest

            npm install --omit=dev --no-audit --no-fund

            [ -f data/media.json ]        || echo "[]" > data/media.json
            [ -f data/activity-log.json ] || echo "[]" > data/activity-log.json
            [ -f data/app-users.json ]    || echo "[]" > data/app-users.json
            [ -f data/otp-store.json ]    || echo "{}" > data/otp-store.json
            [ -f data/admin-users.json ]  || echo "[]" > data/admin-users.json

            mkdir -p public/uploads tmp
            echo "✅ Setup complete"

      # ── Step 4: restart app in a fully detached process ──
      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 1m
          script: |
            # Remove chunk files older than 14 days — long enough for all active
            # service workers (max SW TTL ~24 h) to have updated, with ample margin.
            find ~/public_html/apptest/.next/static/chunks -name "*.js" -mtime +14 -delete 2>/dev/null || true

            # Write restart script using printf to avoid heredoc indentation issues.
            # Kills by PID file (reliable) rather than pkill, which only matched
            # the parent shell and left the node process alive.
            printf '%s\n' \
              '#!/bin/bash' \
              'PID_FILE=~/apptest.pid' \
              'if [ -f "$PID_FILE" ]; then kill "$(cat "$PID_FILE")" 2>/dev/null || true; fi' \
              'for pid in $(ls /proc/ 2>/dev/null | grep -E '"'"'^[0-9]+$'"'"'); do' \
              '  if [ "$(readlink /proc/$pid/cwd 2>/dev/null)" = "/home/blushaur/public_html/apptest" ]; then kill "$pid" 2>/dev/null || true; fi' \
              'done' \
              'sleep 3' \
              'cd /home/blushaur/public_html/apptest' \
              'export PATH=/usr/local/apps/nodejs20/bin:/usr/local/bin:/usr/bin:/bin' \
              'export NODE_ENV=production' \
              'export NEXT_PUBLIC_API_URL=https://apptest.blushaurabd.shop/api' \
              'nohup node server.js >> /home/blushaur/apptest.blushaurabd.shop_6ZGFLhl4.log 2>&1 &' \
              'echo $! > "$PID_FILE"' \
              > /tmp/manu-restart.sh
            chmod +x /tmp/manu-restart.sh
            nohup /tmp/manu-restart.sh </dev/null >/dev/null 2>&1 &
            disown
            echo "✅ Restart queued"
