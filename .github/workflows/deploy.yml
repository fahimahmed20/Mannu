name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Build on CI runner (has plenty of RAM, no OOM risk) ──
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # ── Step 1: backup live data, copy latest source, clear old build ──
      - name: Prepare server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            APP=~/public_html/apptest
            SRC=~/manu-explorers

            # Pull latest code into staging dir
            if [ -d $SRC/.git ]; then
              cd $SRC && git fetch origin main && git reset --hard origin/main
            else
              git clone https://github.com/fahimahmed20/Mannu.git $SRC
            fi

            # Backup live data + credentials from apptest
            mkdir -p /tmp/app-backup
            cp -r $APP/data       /tmp/app-backup/ 2>/dev/null || true
            cp    $APP/.env.local /tmp/app-backup/ 2>/dev/null || true
            cp -r $APP/public/uploads /tmp/app-backup/ 2>/dev/null || true

            # Copy updated source files into apptest
            cp -rf $SRC/app          $APP/
            cp -rf $SRC/lib          $APP/
            cp -rf $SRC/components   $APP/
            cp     $SRC/server.js    $APP/
            cp     $SRC/package.json $APP/
            cp     $SRC/package-lock.json $APP/
            cp     $SRC/next.config.ts    $APP/
            cp     $SRC/tsconfig.json     $APP/
            cp     $SRC/postcss.config.mjs $APP/
            cp     $SRC/eslint.config.mjs  $APP/ 2>/dev/null || true
            cp     $SRC/public/*.js   $APP/public/ 2>/dev/null || true
            cp     $SRC/public/*.json $APP/public/ 2>/dev/null || true
            cp     $SRC/public/*.png  $APP/public/ 2>/dev/null || true
            cp     $SRC/public/*.ico  $APP/public/ 2>/dev/null || true

            # Restore live data and credentials
            cp -r /tmp/app-backup/data/*  $APP/data/   2>/dev/null || true
            cp    /tmp/app-backup/.env.local $APP/      2>/dev/null || true
            mkdir -p $APP/public/uploads
            cp /tmp/app-backup/uploads/* $APP/public/uploads/ 2>/dev/null || true
            rm -rf /tmp/app-backup

            # Clear old build
            rm -rf $APP/.next

      # ── Step 2: upload the pre-built .next + generated SW files from CI ──
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: ".next,public/sw.js,public/workbox-*.js,public/swe-worker-*.js"
          target: "~/public_html/apptest/"

      # ── Step 3: install prod deps, init data files ──
      - name: Finalize
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            cd ~/public_html/apptest

            npm install --omit=dev --no-audit --no-fund

            [ -f data/media.json ]        || echo "[]" > data/media.json
            [ -f data/activity-log.json ] || echo "[]" > data/activity-log.json
            [ -f data/app-users.json ]    || echo "[]" > data/app-users.json
            [ -f data/otp-store.json ]    || echo "{}" > data/otp-store.json
            [ -f data/admin-users.json ]  || echo "[]" > data/admin-users.json

            mkdir -p public/uploads tmp
            echo "✅ Setup complete"

      # ── Step 4: restart app in a fully detached process ──
      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 1m
          script: |
            printf '#!/bin/bash\npkill -f "node server.js" 2>/dev/null || true\nsleep 3\nexport PATH=/usr/local/apps/nodejs20/bin:/usr/local/bin:/usr/bin:/bin\nexport NODE_ENV=production\nexport NEXT_PUBLIC_API_URL=https://apptest.blushaurabd.shop/api\nexec /usr/local/apps/nodejs20/bin/node /home/blushaur/public_html/apptest/server.js >> /home/blushaur/apptest.blushaurabd.shop_6ZGFLhl4.log 2>&1\n' > /tmp/manu-restart.sh
            chmod +x /tmp/manu-restart.sh
            nohup /tmp/manu-restart.sh </dev/null >/dev/null 2>&1 &
            disown
            echo "✅ Restart queued"
