name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Build on CI runner (has plenty of RAM, no OOM risk) ──
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # ── Step 1: backup configs + git pull + clear old build ──
      - name: Prepare server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e

            mkdir -p /tmp/manu-backup
            [ -f ~/manu-explorers/data/categories.json ]  && cp ~/manu-explorers/data/categories.json  /tmp/manu-backup/
            [ -f ~/manu-explorers/data/admin-users.json ] && cp ~/manu-explorers/data/admin-users.json /tmp/manu-backup/
            [ -f ~/manu-explorers/data/app-config.json ]  && cp ~/manu-explorers/data/app-config.json  /tmp/manu-backup/

            if [ -d ~/manu-explorers/.git ]; then
              cd ~/manu-explorers
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/fahimahmed20/Mannu.git ~/manu-explorers
            fi

            rm -rf ~/manu-explorers/.next

      # ── Step 2: upload the pre-built .next from CI ──
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: ".next"
          target: "~/manu-explorers/"

      # ── Step 3: install prod deps, restore configs, restart ──
      - name: Finalize & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            cd ~/manu-explorers

            npm install --omit=dev --no-audit --no-fund

            [ -f /tmp/manu-backup/categories.json ]  && cp /tmp/manu-backup/categories.json  data/
            [ -f /tmp/manu-backup/admin-users.json ] && cp /tmp/manu-backup/admin-users.json data/
            [ -f /tmp/manu-backup/app-config.json ]  && cp /tmp/manu-backup/app-config.json  data/
            rm -rf /tmp/manu-backup

            [ -f data/media.json ]        || echo "[]" > data/media.json
            [ -f data/activity-log.json ] || echo "[]" > data/activity-log.json
            [ -f data/app-users.json ]    || echo "[]" > data/app-users.json
            [ -f data/otp-store.json ]    || echo "{}" > data/otp-store.json

            mkdir -p public/uploads tmp
            touch tmp/restart.txt

            echo "✅ Deployment complete"
