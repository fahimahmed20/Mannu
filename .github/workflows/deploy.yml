name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (verify it compiles)
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e

            # ── Backup runtime data files that admin edits (not safe to overwrite) ──
            mkdir -p /tmp/manu-backup
            [ -f ~/manu-explorers/data/species-data.json ]  && cp ~/manu-explorers/data/species-data.json  /tmp/manu-backup/
            [ -f ~/manu-explorers/data/categories.json ]     && cp ~/manu-explorers/data/categories.json    /tmp/manu-backup/
            [ -f ~/manu-explorers/data/admin-users.json ]    && cp ~/manu-explorers/data/admin-users.json   /tmp/manu-backup/
            [ -f ~/manu-explorers/data/app-config.json ]     && cp ~/manu-explorers/data/app-config.json    /tmp/manu-backup/

            # ── Clone fresh if not a git repo, otherwise pull ──
            if [ -d ~/manu-explorers/.git ]; then
              cd ~/manu-explorers
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf ~/manu-explorers
              git clone https://github.com/fahimahmed20/Mannu.git ~/manu-explorers
              cd ~/manu-explorers
            fi

            # ── Restore admin data files ──
            [ -f /tmp/manu-backup/species-data.json ] && cp /tmp/manu-backup/species-data.json data/
            [ -f /tmp/manu-backup/categories.json ]   && cp /tmp/manu-backup/categories.json   data/
            [ -f /tmp/manu-backup/admin-users.json ]  && cp /tmp/manu-backup/admin-users.json  data/
            [ -f /tmp/manu-backup/app-config.json ]   && cp /tmp/manu-backup/app-config.json   data/
            rm -rf /tmp/manu-backup

            # ── Install & build ──
            npm ci --prefer-offline
            npm run build

            # ── Init runtime data files if missing ──
            [ -f data/media.json ]       || echo "[]"  > data/media.json
            [ -f data/activity-log.json ] || echo "[]" > data/activity-log.json
            [ -f data/app-users.json ]    || echo "[]" > data/app-users.json
            [ -f data/otp-store.json ]    || echo "{}" > data/otp-store.json

            # ── Restart app ──
            mkdir -p public/uploads tmp
            touch tmp/restart.txt

            echo "✅ Deployment complete"
